name: Tests and privacy checks

on:
  # Branches are tested through their pull request, so each push runs once (not once for the push and once for the PR)
  push:
    branches: [main]
    tags: ['release-*']
  pull_request:
  # The merge queue on main tests each pull request on top of the latest main (and the entries ahead of it) before it lands
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'  # weekly, so a new OpenClaw release that breaks something shows up here

permissions:
  contents: read

# A new push to a pull request cancels its run still going: only the newest commit can be merged anyway.
# main, tags, merge queue runs and the weekly run are never canceled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.12'
            node: '24.16.0'
            openclaw: '2026.10.5'
          - python: '3.14'
            node: '26'  # current Node 26: latest OpenClaw can raise its patch-level minimum
            openclaw: 'latest'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install OpenClaw and browser
        run: |
          npm install --global openclaw@${{ matrix.openclaw }}
          npx --yes --package=playwright@1.63.0 playwright install --with-deps chromium
          printf 'OPENCLAW_PACKAGE_DIR=%s/openclaw\n' "$(npm root -g)" >> "$GITHUB_ENV"
      - name: Install the pinned Node packages
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Select Chromium
        run: |
          node --input-type=module -e 'const {chromium}=await import(process.env.OPENCLAW_PACKAGE_DIR+"/node_modules/playwright-core/index.mjs"); console.log("CHROMIUM_PATH="+chromium.executablePath())' >> "$GITHUB_ENV"
      - name: Test Python, Node, OpenClaw SDK and dashboard
        run: python3 scripts/test.py
      - name: Check whitespace
        run: git diff --check

  help:
    # The help articles (docs/help/, the help at themachine.computer/help) against the code: every connector, dashboard
    # tab and Settings tab has one, and each names only buttons, routes and commands that still exist.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check the help articles
        run: python3 scripts/help_check.py

  portable:
    # macOS runs natively under launchd; Windows runs The Machine inside WSL2 (Linux), so this checks the portable core.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # macOS runners are scarce (a few at once for the whole organization): a macOS job per pull request, merge queue
        # entry or main push queued for hours. macOS runs on release tags (what Machines install), the weekly run and on demand.
        os: ${{ fromJSON((startsWith(github.ref, 'refs/tags/release-') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["macos-latest", "windows-latest"]' || '["windows-latest"]') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.16.0'
      - name: Time zones for Python on Windows (Linux and macOS have them built in)
        if: runner.os == 'Windows'
        run: python -m pip install --quiet tzdata
      - name: Install OpenClaw and browser
        run: |
          npm install --global openclaw@2026.10.5
          npx --yes --package=playwright@1.63.0 playwright install chromium
          printf 'OPENCLAW_PACKAGE_DIR=%s/openclaw\n' "$(npm root -g)" >> "$GITHUB_ENV"
      - name: Install the pinned Node packages
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Select Chromium
        run: |
          node --input-type=module -e 'import {pathToFileURL} from "node:url"; const {chromium}=await import(pathToFileURL(process.env.OPENCLAW_PACKAGE_DIR+"/node_modules/playwright-core/index.mjs").href); console.log("CHROMIUM_PATH="+chromium.executablePath())' >> "$GITHUB_ENV"
      - name: Test Python, Node, OpenClaw SDK and dashboard
        env:
          THE_MACHINE_TEST_TIMEOUT: '240'
        run: python scripts/test.py
      - name: Installer dry run
        run: python installer.py --dry-run
      - name: Windows installer dry run
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./install.ps1 -DryRun

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan all reachable history with Gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --location --silent --show-error "$base/$archive" --output "$RUNNER_TEMP/$archive"
          curl --fail --location --silent --show-error "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" --output "$RUNNER_TEMP/checksums.txt"
          (cd "$RUNNER_TEMP" && sha256sum --check --ignore-missing checksums.txt)
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --log-opts=--all --no-banner
